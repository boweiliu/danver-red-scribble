# Red Scribble: serves the scribble/type/voice feedback plug-in on its own origin, so any app
# can opt in with one line of its own HTML (see system/libs/red_scribble/README.md). Registers
# an icon so the workspace draws its logo rather than a generic glyph. Its published default
# port (8082) collides with chat-hub-control here, and 8086/8087 (its adapted port choice) turned
# out to also collide with fleet-dash (added after this template was branched), so it's on 8088.
[program:red-scribble]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/red_scribble && uv sync --locked --project system/apps/red_scribble && python3 system/scripts/forward_port.py --url http://localhost:8088 --name red-scribble --icon-file system/libs/red_scribble/src/red_scribble/assets/logo-circle.svg --program red-scribble && RED_SCRIBBLE_SERVICE_PORT=8088 exec system/apps/red_scribble/.venv/bin/red-scribble-service"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/red-scribble-stdout.log
stderr_logfile=/var/log/supervisor/red-scribble-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
