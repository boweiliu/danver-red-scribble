# Scribble Box: the scratchpad page Red Scribble's opt-in is demonstrated on, and the
# quickest way to try scribbling without opting a real app in first.
[program:scribble-box]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/scribble_box && uv sync --locked --project system/apps/scribble_box && python3 system/scripts/forward_port.py --url http://localhost:8087 --name scribble-box --icon-file .app-icons/scribble-box.svg --program scribble-box && SCRIBBLE_BOX_PORT=8087 exec system/apps/scribble_box/.venv/bin/scribble-box"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/scribble-box-stdout.log
stderr_logfile=/var/log/supervisor/scribble-box-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
