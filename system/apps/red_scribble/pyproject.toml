[project]
name = "red-scribble-service"
version = "0.1.0"
description = "Serves the Red Scribble plug-in, config, and feedback endpoints on their own workspace origin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "red-scribble",
    "imbue-common",
    "imbue-mngr",
]

[project.scripts]
red-scribble-service = "red_scribble_service.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_scribble_service"]
